[project]
name = "testagent"
version = "0.1.0"
description = "TestAgent: ontology-driven, agent-assisted functional test platform"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Coral-Lee" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "langchain-core>=1.7,<2",
    "langchain-openai>=1.7,<2",
    "croniter>=2,<7",
    "playwright>=1.50",
    "pytest>=8.3",
    "pytest-playwright>=0.7",
    "argon2-cffi>=23.1",
]

[project.urls]
Homepage = "https://github.com/Coral-TSS/testagent"
Repository = "https://github.com/Coral-TSS/testagent"
Issues = "https://github.com/Coral-TSS/testagent/issues"
Changelog = "https://github.com/Coral-TSS/testagent/blob/main/CHANGELOG.md"

[project.scripts]
testagent = "testagent.launch:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "jsonschema[format-nongpl]>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["testagent", "conftest", "examples"]
