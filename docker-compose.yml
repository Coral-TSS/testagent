# TestAgent: platform + PostgreSQL 17 + the procurement demo SUT (+ Caddy HTTPS proxy, profile "public").
#   cp .env.example .env      # set POSTGRES_PASSWORD, TESTAGENT_ADMIN_USER, TESTAGENT_ADMIN_PASSWORD
#   docker compose up -d --build
# Local: open http://localhost:8765 and sign in with the admin account.
# Public server: also set COMPOSE_PROFILES=public and TESTAGENT_PUBLIC_HOST (see docs/deployment.md),
# then open https://<public IP>/. Configure an OpenAI-compatible model under "Agent settings".

name: testagent

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: testagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (cp .env.example .env)}
      POSTGRES_DB: testagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testagent -d testagent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  demo:
    build:
      context: .
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    image: testagent:${TESTAGENT_VERSION:-0.1.0}
    command: ["demo"]
    environment:
      PROCUREMENT_DEMO_BUGS: ${PROCUREMENT_DEMO_BUGS:-1}
    volumes:
      - demo-data:/data
    ports:
      - "127.0.0.1:8766:8766"
    healthcheck:
      test: ["CMD", "/app/ops/docker-entrypoint.sh", "healthcheck", "http://127.0.0.1:8766/openapi.json"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  testagent:
    build:
      context: .
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    image: testagent:${TESTAGENT_VERSION:-0.1.0}
    command: ["platform"]
    depends_on:
      db:
        condition: service_healthy
      demo:
        condition: service_started
    environment:
      TESTAGENT_DATABASE_URL: postgresql://testagent:${POSTGRES_PASSWORD}@db:5432/testagent
      # first admin, created only while there are no accounts (remove the password afterwards)
      TESTAGENT_ADMIN_USER: ${TESTAGENT_ADMIN_USER:-}
      TESTAGENT_ADMIN_PASSWORD: ${TESTAGENT_ADMIN_PASSWORD:-}
      TESTAGENT_ALLOWED_HOSTS: ${TESTAGENT_PUBLIC_HOST:-},${TESTAGENT_ALLOWED_HOSTS:-}
      # X-Forwarded-* from the proxy count; 8765 is only reachable from this host and the compose network
      TESTAGENT_TRUSTED_PROXIES: "*"
      TESTAGENT_SESSION_IDLE_HOURS: ${TESTAGENT_SESSION_IDLE_HOURS:-12}
      TESTAGENT_SESSION_MAX_DAYS: ${TESTAGENT_SESSION_MAX_DAYS:-7}
      TESTAGENT_TIMEZONE: ${TESTAGENT_TIMEZONE:-UTC}
      TESTAGENT_AGENT_LANGUAGE: ${TESTAGENT_AGENT_LANGUAGE:-English}
      TESTAGENT_SEED_DEMO: ${TESTAGENT_SEED_DEMO:-1}
      TESTAGENT_DEMO_URL: http://demo:8766
    volumes:
      - testagent-data:/data   # runtime/: model API key (secrets.json), test repos, artifacts, logs
    ports:
      - "127.0.0.1:${TESTAGENT_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "/app/ops/docker-entrypoint.sh", "healthcheck", "http://127.0.0.1:8765/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  proxy:  # public HTTPS on 443 (COMPOSE_PROFILES=public); the only service reachable from outside
    image: caddy:2.11-alpine
    profiles: ["public"]
    # refuse to start without the public address (an empty site address would match every host name)
    command:
      - sh
      - -c
      - '[ -n "$$TESTAGENT_PUBLIC_HOST" ] || { echo "set TESTAGENT_PUBLIC_HOST in .env" >&2; exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    depends_on:
      testagent:
        condition: service_started
    environment:
      TESTAGENT_PUBLIC_HOST: ${TESTAGENT_PUBLIC_HOST:-}  # required with this profile: the public IP
      TESTAGENT_TLS: ${TESTAGENT_TLS:-acme}
    ports:
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # certificates, ACME account, internal CA: keep it (rate limits)
      - caddy-config:/config
    restart: unless-stopped

volumes:
  pgdata:
  demo-data:
  testagent-data:
  caddy-data:
  caddy-config:
